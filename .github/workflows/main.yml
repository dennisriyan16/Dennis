name: Core PHP CI/CD Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Run PHP Hello World Test
        run: |
          OUTPUT=$(php hello.php)
          if [ "$OUTPUT" = "Hello Dennis" ]; then
            echo "Test passed: Hello Dennis"
          else
            echo "Test failed: Expected 'Hello Dennis', got '$OUTPUT'"
            exit 1
          fi

  deploy-to-cpanel:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build-and-test

    # ONLY deploy if on the main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/Dennis/
